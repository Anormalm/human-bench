[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "shuorenhua-bench"
version = "0.3.0"
description = "Context- and population-conditioned evaluation of model-generated text"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Lifan Hu"}]
dependencies = [
  "numpy>=1.24",
  "pydantic>=2.6",
  "PyYAML>=6.0",
  "scipy>=1.10",
]

[project.optional-dependencies]
stats = ["scipy>=1.10", "statsmodels>=0.14"]
semantic = ["sentence-transformers>=3.0"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
shuorenhua-build-pairs = "shuorenhua_bench.pairing:main"
shuorenhua = "shuorenhua_bench.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/shuorenhua_bench"]

[tool.vercel]
entrypoint = "api.index:app"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
